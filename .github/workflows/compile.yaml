name: compile magic-r
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: tl_packages

      - name: '✅ Run the test suite'
        run: l3build check

      - name: '✅ Test the flowR bridge'
        run: node --test tests/node/*.test.mjs

      # the oldest xlistings magic-r supports (\mr@xlistings@min in magic-r.sty, v1.0.0 of 2026/08/17)
      - name: '✅ Run the test suite with the oldest supported xlistings'
        run: |
          git -C xlistings fetch --depth 1 origin e45cc1091f795934671d8ead041e9c4da63baf6d
          git -C xlistings checkout --detach e45cc1091f795934671d8ead041e9c4da63baf6d
          l3build check
          git -C xlistings checkout --detach -

      - name: '🔍 Upload the test output for inspection'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            /tmp/magic-r/test/*.log
            /tmp/magic-r/test-config-lua/*.log
            /tmp/magic-r/test/*.diff
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the documentation goes to the gh-pages branch
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: tl_packages

      - name: Install R and flowR
        run: |
          sudo apt-get install -y r-base-core
          npm install -g @eagleoutice/flowr

      - name: '✅ Test the flowR bridge with a real flowR'
        run: MAGIC_R_FLOWR=flowr node --test tests/node/*.test.mjs

      - name: '⏱️ Run the benchmark'
        run: l3build bench

      - name: Build examples and documentation
        run: latexmk

      - name: '📖 Typeset the documentation with l3build (shell escape, R and flowR)'
        run: |
          l3build doc
          ! grep -q 'Shell escape is not available' /tmp/magic-r/doc/magic-r-doc.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: result
          path: |
            build/*.pdf
            bench/bench-results.tex

      - name: Publish the PDFs to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp build/*.pdf .
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f example.pdf example-beamer.pdf magic-r-doc.pdf
          git commit -m "Newly compiled documentation" || echo "nothing new to commit"

      - name: Push to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true
