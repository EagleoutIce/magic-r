name: compile magic-r
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# a newer push to a pull request replaces its run, runs on main always finish (they publish)
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event_name }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the version of flowR the tests and the manual run with (the shipped database names its own in its first line)
  FLOWR_VERSION: 2.16.1
  # the oldest xlistings magic-r supports (\mr@xlistings@min in magic-r.sty, v1.0.0 of 2026/08/17)
  XLISTINGS_MIN: e45cc1091f795934671d8ead041e9c4da63baf6d

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: tl_packages

      - name: '✅ Run the test suite'
        run: l3build check

      - name: '✅ Test the flowR bridge'
        run: node --test tests/node/*.test.mjs

      - name: '✅ Run the test suite with the oldest supported xlistings'
        run: |
          git -C xlistings fetch --depth 1 origin "$XLISTINGS_MIN"
          git -C xlistings checkout --detach "$XLISTINGS_MIN"
          l3build check

      - name: '🔍 Upload the test output for inspection'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            /tmp/magic-r/test/*.log
            /tmp/magic-r/test/*.diff
            /tmp/magic-r/test-config-lua/*.log
            /tmp/magic-r/test-config-lua/*.diff
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # the documentation goes to the gh-pages branch
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: tl_packages

      - name: Install R and flowR
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends r-base-core
          # --ignore-scripts: flowR runs tree-sitter as WebAssembly, the native build it would start is not needed
          npm install -g --ignore-scripts "@eagleoutice/flowr@$FLOWR_VERSION"
          Rscript --version
          node "$(npm root -g)/@eagleoutice/flowr/cli/flowr.js" --version

      - name: '✅ Test the flowR bridge with a real flowR'
        run: MAGIC_R_FLOWR="node $(npm root -g)/@eagleoutice/flowr/cli/flowr.js" node --test tests/node/*.test.mjs

      # magic-r in lib/ of a project (relative TEXINPUTS) and the output in build/: no hang, flowR answers
      - name: '✅ Build a document laid out as projects do'
        run: sh tools/layout-test.sh

      - name: '⏱️ Run the benchmark'
        run: l3build bench

      # magic-r finds the flowR of 'npm install -g' itself, R is Rscript on the path
      - name: '📖 Build examples and documentation (shell escape, R and flowR)'
        run: |
          latexmk
          for f in example example-beamer magic-r-doc; do
            grep -q 'mrFlowrStatus{ok}{node flowR' "build/$f.mr.cfg" || { echo "::error::flowR did not answer for $f"; head -n 3 "build/$f.mr.cfg"; exit 1; }
          done
          if grep -E 'Shell escape is not available|Package magic-r Warning' build/*.log; then
            echo "::error::magic-r warned while building the documentation"; exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result
          path: |
            build/*.pdf
            build/*.log
            bench/bench-results.tex
          if-no-files-found: ignore

      - name: Publish the PDFs to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp build/*.pdf .
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f example.pdf example-beamer.pdf magic-r-doc.pdf
          git commit -m "Newly compiled documentation" || echo "nothing new to commit"

      - name: Push to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ad-m/github-push-action@v1.3.0
        with:
          branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true
