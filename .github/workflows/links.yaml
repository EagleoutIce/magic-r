name: verify links
on:
  push:
    branches:
      - main
    paths:
      - magic-r-links.cfg
      - magic-r-flowr.mjs
  schedule:
    # weekly, so pages that disappear are caught without a push
    - cron: "27 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Request every documentation page of the database
        run: node magic-r-flowr.mjs verify
